<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Knowledge Base</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top bar */
    #topbar {
      background: #4B0082;
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    #topbar-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #topbar-title .logo {
      width: 30px;
      height: 30px;
      background: #6CC24A;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      font-weight: bold;
    }
    #topbar-user {
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #user-email {
      background: rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 13px;
      color: #fff;
    }

    /* Body layout */
    #layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 260px;
      background: #f9f6fd;
      border-right: 1px solid #e0d6f0;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #sidebar-header {
      padding: 16px;
      font-size: 12px;
      font-weight: 700;
      color: #4B0082;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border-bottom: 1px solid #e0d6f0;
      background: #fff;
    }
    #doc-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .doc-item {
      padding: 8px 16px;
      font-size: 13px;
      color: #1a1a1a;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      cursor: default;
      transition: background 0.15s;
    }
    .doc-item:hover {
      background: #ede8f7;
    }
    .doc-icon {
      font-size: 15px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .doc-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .doc-chars {
      font-size: 11px;
      color: #999;
      flex-shrink: 0;
    }
    #sidebar-loading {
      padding: 20px 16px;
      color: #666;
      font-size: 13px;
      text-align: center;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #e0d6f0;
      border-top-color: #4B0082;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid #e0d6f0;
      background: #fff;
    }
    #reload-btn {
      width: 100%;
      padding: 8px;
      background: #fff;
      border: 1px solid #4B0082;
      border-radius: 4px;
      font-size: 13px;
      color: #4B0082;
      cursor: pointer;
      transition: background 0.15s;
    }
    #reload-btn:hover { background: #ede8f7; }
    #reload-btn:disabled { color: #9aa0a6; border-color: #ccc; cursor: not-allowed; }

    /* Chat area */
    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Message bubbles */
    .msg {
      display: flex;
      gap: 10px;
      max-width: 780px;
    }
    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg.assistant {
      align-self: flex-start;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      margin-top: 2px;
    }
    .msg.user .avatar {
      background: #4B0082;
      color: white;
    }
    .msg.assistant .avatar {
      background: #6CC24A;
      color: white;
    }
    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      max-width: 680px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg.user .bubble {
      background: #4B0082;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .bubble {
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #e0d6f0;
      border-bottom-left-radius: 4px;
    }

    /* Typing indicator */
    .typing-dots {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 14px 16px;
    }
    .typing-dots span {
      width: 8px;
      height: 8px;
      background: #6CC24A;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Input area */
    #input-area {
      background: #fff;
      border-top: 1px solid #dadce0;
      padding: 16px 24px;
      flex-shrink: 0;
    }
    #input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 780px;
      margin: 0 auto;
    }
    #user-input {
      flex: 1;
      border: 1px solid #dadce0;
      border-radius: 24px;
      padding: 10px 18px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 140px;
      overflow-y: auto;
      line-height: 1.5;
      transition: border-color 0.15s;
    }
    #user-input:focus { border-color: #4B0082; }
    #send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #4B0082;
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
      transition: background 0.15s;
    }
    #send-btn:hover { background: #6CC24A; }
    #send-btn:disabled { background: #ccc; cursor: not-allowed; }
    #powered-by {
      text-align: center;
      font-size: 11px;
      color: #9aa0a6;
      margin-top: 8px;
    }

    /* Welcome / system message */
    .system-msg {
      text-align: center;
      color: #4B0082;
      font-size: 13px;
      padding: 8px 16px;
      background: #ede8f7;
      border-radius: 12px;
      align-self: center;
      max-width: 500px;
    }

    /* Error toast */
    #error-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #d93025;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
      z-index: 100;
      max-width: 500px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="topbar">
    <div id="topbar-title">
      <div class="logo">T</div>
      TELUS Knowledge Base
    </div>
    <div id="topbar-user">
      <span id="user-email">Loading...</span>
    </div>
  </div>

  <div id="layout">
    <div id="sidebar">
      <div id="sidebar-header">Documents</div>
      <div id="doc-list">
        <div id="sidebar-loading">
          <span class="spinner"></span> Loading documents...
        </div>
      </div>
      <div id="sidebar-footer">
        <button id="reload-btn" onclick="reloadDocs()">Reload Documents</button>
      </div>
    </div>

    <div id="chat-area">
      <div id="messages">
        <!-- Messages appear here -->
      </div>
      <div id="input-area">
        <div id="input-row">
          <textarea
            id="user-input"
            rows="1"
            placeholder="Ask a question about your documents..."
            onkeydown="handleKey(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button id="send-btn" onclick="sendMessage()" title="Send (Enter)">&#9658;</button>
        </div>
        <div id="powered-by">Powered by TELUS Fuelix &amp; Claude</div>
      </div>
    </div>
  </div>

  <div id="error-toast"></div>

  <script>
    var chatHistory = [];
    var docsLoaded = false;
    var sendingInProgress = false;

    // ---- Initialise ----
    google.script.run
      .withSuccessHandler(onStatus)
      .withFailureHandler(function(e) { console.error('getStatus error', e); })
      .getStatus();

    loadDocuments();

    // ---- Status / user info ----
    function onStatus(status) {
      var emailEl = document.getElementById('user-email');
      emailEl.textContent = status.userEmail || 'Unknown user';

      if (!status.anthropicConfigured) {
        showError('Warning: ANTHROPIC_API_KEY is not configured in Script Properties.');
      }
    }

    // ---- Documents ----
    function loadDocuments() {
      docsLoaded = false;
      document.getElementById('sidebar-loading').style.display = 'block';
      document.getElementById('doc-list').innerHTML =
        '<div id="sidebar-loading"><span class="spinner"></span> Loading documents...</div>';

      google.script.run
        .withSuccessHandler(onDocs)
        .withFailureHandler(onDocsError)
        .getDocuments();
    }

    function onDocs(docs) {
      docsLoaded = true;
      var list = document.getElementById('doc-list');
      list.innerHTML = '';

      if (!docs || docs.length === 0) {
        list.innerHTML = '<div class="doc-item" style="color:#5f6368;">No documents found.</div>';
        addSystemMessage('No documents were found. Check that FOLDER_IDS is set correctly in Script Properties and that you have access to the folders.');
        return;
      }

      docs.forEach(function(doc) {
        var item = document.createElement('div');
        item.className = 'doc-item';
        item.title = doc.name + ' (' + (doc.charCount || 0).toLocaleString() + ' chars)';

        var icon = getIcon(doc.mimeType);
        var chars = doc.charCount > 1000
          ? Math.round(doc.charCount / 1000) + 'k'
          : (doc.charCount || 0) + '';

        item.innerHTML =
          '<span class="doc-icon">' + icon + '</span>' +
          '<span class="doc-name">' + escHtml(doc.name) + '</span>' +
          '<span class="doc-chars">' + chars + '</span>';

        list.appendChild(item);
      });

      addSystemMessage('Hi! I\'ve loaded ' + docs.length + ' document' + (docs.length === 1 ? '' : 's') + '. Ask me anything about them.');
    }

    function onDocsError(err) {
      document.getElementById('doc-list').innerHTML =
        '<div class="doc-item" style="color:#d93025;">Error loading documents.</div>';
      showError('Failed to load documents: ' + (err.message || err));
    }

    function reloadDocs() {
      var btn = document.getElementById('reload-btn');
      btn.disabled = true;
      btn.textContent = 'Reloading...';

      google.script.run
        .withSuccessHandler(function(msg) {
          btn.disabled = false;
          btn.textContent = 'Reload Documents';
          loadDocuments();
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = 'Reload Documents';
          showError('Reload failed: ' + (err.message || err));
        })
        .reloadCache();
    }

    function getIcon(mimeType) {
      if (mimeType === 'application/vnd.google-apps.document') return '&#128196;';      // document
      if (mimeType === 'application/vnd.google-apps.spreadsheet') return '&#128202;';  // chart
      if (mimeType === 'application/vnd.google-apps.presentation') return '&#128209;'; // slides
      return '&#128196;';
    }

    // ---- Chat ----
    function sendMessage() {
      if (sendingInProgress) return;
      var input = document.getElementById('user-input');
      var msg = input.value.trim();
      if (!msg) return;

      input.value = '';
      autoResize(input);

      appendMessage('user', msg);
      chatHistory.push({ role: 'user', content: msg });

      var typingId = showTyping();
      setSending(true);

      var historySnapshot = chatHistory.slice(0, -1); // history before this message

      google.script.run
        .withSuccessHandler(function(reply) {
          removeTyping(typingId);
          setSending(false);
          appendMessage('assistant', reply);
          chatHistory.push({ role: 'assistant', content: reply });
          scrollToBottom();
        })
        .withFailureHandler(function(err) {
          removeTyping(typingId);
          setSending(false);
          appendMessage('assistant', 'Sorry, an error occurred: ' + (err.message || err));
          chatHistory.pop(); // remove the user message we pushed
          scrollToBottom();
        })
        .chat(msg, historySnapshot);

      scrollToBottom();
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }

    function setSending(val) {
      sendingInProgress = val;
      document.getElementById('send-btn').disabled = val;
    }

    // ---- UI helpers ----
    function appendMessage(role, text) {
      var messages = document.getElementById('messages');
      var div = document.createElement('div');
      div.className = 'msg ' + role;

      var initial = role === 'user' ? 'U' : '&#129302;';
      div.innerHTML =
        '<div class="avatar">' + initial + '</div>' +
        '<div class="bubble">' + escHtml(text) + '</div>';

      messages.appendChild(div);
      scrollToBottom();
    }

    function addSystemMessage(text) {
      var messages = document.getElementById('messages');
      var div = document.createElement('div');
      div.className = 'system-msg';
      div.textContent = text;
      messages.appendChild(div);
      scrollToBottom();
    }

    function showTyping() {
      var messages = document.getElementById('messages');
      var div = document.createElement('div');
      var id = 'typing-' + Date.now();
      div.id = id;
      div.className = 'msg assistant';
      div.innerHTML =
        '<div class="avatar">&#129302;</div>' +
        '<div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
      messages.appendChild(div);
      scrollToBottom();
      return id;
    }

    function removeTyping(id) {
      var el = document.getElementById(id);
      if (el) el.remove();
    }

    function scrollToBottom() {
      var msgs = document.getElementById('messages');
      msgs.scrollTop = msgs.scrollHeight;
    }

    function showError(msg) {
      var toast = document.getElementById('error-toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(function() { toast.style.display = 'none'; }, 6000);
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
