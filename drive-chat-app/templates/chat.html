<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drive Knowledge Base</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="chat-page">

  <header class="topbar">
    <div class="topbar-left">
      <svg width="28" height="28" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#4285f4"/>
        <path d="M14 32L24 16L34 32H14Z" fill="white" opacity="0.9"/>
        <circle cx="24" cy="26" r="5" fill="white"/>
      </svg>
      <span class="topbar-title">Drive Knowledge Base</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-email">{{ email }}</span>
      <a href="/logout" class="btn-logout">Sign out</a>
    </div>
  </header>

  <div class="app-body">

    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Documents</h2>
      </div>
      <ul class="doc-list" id="doc-list">
        <li class="doc-item-loading">Loading documents...</li>
      </ul>
    </aside>

    <main class="chat-main">
      <div class="messages" id="messages">
        <div class="message assistant">
          <div class="message-bubble">
            Hello! I have access to your Drive documents. Ask me anything about them.
          </div>
        </div>
      </div>

      <div class="chat-input-area">
        <div class="input-row">
          <textarea
            id="user-input"
            class="chat-textarea"
            placeholder="Ask a question about your documents... (Enter to send, Shift+Enter for newline)"
            rows="1"
          ></textarea>
          <button id="send-btn" class="btn-send" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </main>

  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const docListEl = document.getElementById('doc-list');

    let history = [];
    let isLoading = false;

    async function fetchDocuments() {
      try {
        const res = await fetch('/documents');
        const docs = await res.json();
        docListEl.innerHTML = '';
        if (!docs.length) {
          docListEl.innerHTML = '<li class="doc-item-empty">No documents loaded.</li>';
          return;
        }
        docs.forEach(doc => {
          const li = document.createElement('li');
          li.className = 'doc-item';
          const sizeKb = (doc.size / 1024).toFixed(1);
          li.innerHTML = `
            <span class="doc-name" title="${escapeHtml(doc.filename)}">${escapeHtml(doc.filename)}</span>
            <span class="doc-size">${sizeKb} KB</span>
          `;
          docListEl.appendChild(li);
        });
      } catch (e) {
        docListEl.innerHTML = '<li class="doc-item-error">Failed to load documents.</li>';
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = content;
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function showSpinner() {
      const div = document.createElement('div');
      div.className = 'message assistant';
      div.id = 'spinner-msg';
      div.innerHTML = '<div class="message-bubble spinner-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
      messagesEl.appendChild(div);
      scrollToBottom();
    }

    function removeSpinner() {
      const el = document.getElementById('spinner-msg');
      if (el) el.remove();
    }

    function setLoading(val) {
      isLoading = val;
      sendBtn.disabled = val;
      inputEl.disabled = val;
    }

    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message || isLoading) return;

      appendMessage('user', message);
      history.push({ role: 'user', content: message });
      inputEl.value = '';
      inputEl.style.height = 'auto';

      setLoading(true);
      showSpinner();

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, history: history.slice(0, -1) }),
        });
        const data = await res.json();
        removeSpinner();

        if (data.error) {
          appendMessage('assistant', `Error: ${data.error}`);
        } else {
          appendMessage('assistant', data.reply);
          history.push({ role: 'assistant', content: data.reply });
        }
      } catch (e) {
        removeSpinner();
        appendMessage('assistant', 'Network error. Please check your connection and try again.');
      } finally {
        setLoading(false);
        inputEl.focus();
      }
    }

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    });

    sendBtn.addEventListener('click', sendMessage);

    fetchDocuments();
  </script>
</body>
</html>
